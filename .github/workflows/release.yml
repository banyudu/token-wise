name: Release

# Manual dispatch only — never auto-triggers. Runs on the self-hosted macOS
# runner (free), which reads signing secrets from the login Keychain.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel(s) to build and upload"
        type: choice
        options:
          - both
          - appstore
          - dev
        default: both

# Serialize releases so two runs never fight over the build/keychain.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # gh release create/upload (dev channel)

jobs:
  release:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      # Native Swift pipeline (apple/) — no Node/Rust toolchain needed.
      - name: Build & upload
        env:
          CHANNEL: ${{ inputs.channel }}
        run: scripts/release-all.sh "$CHANNEL"

      # Keep GitHub Releases as the public source for signed direct-download
      # builds. The dev release script also publishes the same DMG to S3 for
      # the stable updater URL.
      - name: Publish GitHub Release
        if: inputs.channel == 'both' || inputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          gh release create "v${VERSION}" \
            "dist-swift/token-wise_${VERSION}_universal.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Token Wise v${VERSION}" \
            --generate-notes
