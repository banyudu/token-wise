[package]
name = "token-wise"
version = "0.1.9"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "token_wise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[features]
# `updater` ships the self-update path (Developer ID / direct-distribution
# builds). The App Store build is compiled with `--no-default-features` so the
# updater plugin is entirely absent from the MAS binary.
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
chrono = "0.4"
rayon = "1.10"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
